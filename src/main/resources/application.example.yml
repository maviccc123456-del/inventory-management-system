spring:
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/warhouse?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      max-active: 20
      max-wait: 5000
      initial-size: 1
      filters: stat,log4j,wall
      validation-query: SELECT 'X'
      stat-view-servlet:
        enabled: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 10MB
  thymeleaf:
    cache: false
    enabled: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  global-config:
    db-config:
      id-type: auto

shiro:
  hash-algorithm-name: md5
  hash-iterations: 2
  anon-urls:
    - /index.html*
    - /sys/toLogin*
    - /login/login*
    - /login/getCode
    - /resources/**
  login-url: /index.html
  log-out-url: /login/logout*
  authc-ulrs:
    - /**

server:
  port: ${PORT:8888}
